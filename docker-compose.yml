services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tabletap
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/tabletap
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me-in-production}
      APP_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
